# ---------------------------------------------------------------------------
# Stack Escrilex — colar no Web editor do Portainer.
#
# Todos os valores vem das "Environment variables" da stack no Portainer.
# A lista completa esta em env.example.
#
# As imagens sao buildadas direto dos repositorios publicos no GitHub: o Docker
# clona a URL do `build.context` sozinho, entao nao e preciso ter o codigo no
# servidor nem publicar as imagens em um registry.
# ---------------------------------------------------------------------------

services:
  traefik:
    # >= 3.6.1 e obrigatorio: versoes anteriores falavam com o daemon usando a
    # API 1.24 fixa, que o Docker 29 recusa ("client version 1.24 is too old").
    # A partir da 3.6.1 o Traefik negocia a versao da API com o daemon.
    image: ${TRAEFIK_IMAGE:-traefik:v3.7.10}
    container_name: escrilex-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=escrilex-web
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redireciona todo HTTP para HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?defina ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - web

  db:
    image: postgres:16-alpine
    container_name: escrilex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-escrilex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-escrilex}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-escrilex} -d ${POSTGRES_DB:-escrilex}
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ${API_REPO:-https://github.com/DKdevs-Digital-Solutions/escrilex-back.git#main}
    image: ${API_IMAGE:-escrilex-api:latest}
    container_name: escrilex-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-escrilex}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-escrilex}?schema=public
      API_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      WEB_ORIGINS: https://${FRONT_DOMAIN:?defina FRONT_DOMAIN}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      OVERDUE_SCAN_EVERY_MINUTES: ${OVERDUE_SCAN_EVERY_MINUTES:-10}
    # Aplica as migrations pendentes antes de subir a API
    command: sh -c "npx prisma migrate deploy && node src/server.js"
    labels:
      - traefik.enable=true
      - traefik.docker.network=escrilex-web
      - traefik.http.routers.api.rule=Host(`${API_DOMAIN:?defina API_DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=3000
    networks:
      - web
      - internal

  web:
    build:
      context: ${WEB_REPO:-https://github.com/DKdevs-Digital-Solutions/escrilex-front.git#main}
    image: ${WEB_IMAGE:-escrilex-web:latest}
    container_name: escrilex-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Injetada no bundle do front no start do container
      API_URL: https://${API_DOMAIN:?defina API_DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.docker.network=escrilex-web
      - traefik.http.routers.web.rule=Host(`${FRONT_DOMAIN:?defina FRONT_DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls=true
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.services.web.loadbalancer.server.port=80
    networks:
      - web

networks:
  web:
    name: escrilex-web
  internal:
    name: escrilex-internal
    internal: true

volumes:
  db_data:
  traefik_letsencrypt:
